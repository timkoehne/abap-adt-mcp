# Runs the tests. They mock the SAP connection, so no SAP system is needed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # lets the publish workflow run the tests before releasing
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
